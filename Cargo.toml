[package]
name = "rust4failures"
version = "0.1.0"
rust-version = "1.99.0"
edition = "2024"

[dependencies]

[dev-dependencies]
rstest = "0.23"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
expect_used = "warn"
unwrap_used = "warn"
upper_case_acronyms = "allow"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies.wasm-bindgen]
version = "0.2"
optional = true
